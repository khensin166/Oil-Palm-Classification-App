name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**' # Hanya jalan jika ada perubahan di folder backend
  workflow_dispatch: # Memungkinkan trigger manual dari Github Actions UI

env:
  REGISTRY: ghcr.io
  # Menggunakan username github Anda
  IMAGE_NAME: khensin166/palm-classification-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
